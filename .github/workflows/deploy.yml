name: Django Production Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            set -x

            send_telegram() {
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d message_thread_id="${{ secrets.TELEGRAM_THREAD_ID }}" \
              -d text="$1" > /dev/null
            }

            trap 'send_telegram "❌ FAILED at: $CURRENT_STEP\nCMD: $BASH_COMMAND"' ERR

            send_telegram "🚀 Deploy STARTED"

            # --------------------
            CURRENT_STEP="cd project"
            cd /root/axrortech

            # --------------------
            CURRENT_STEP="git sync"
            send_telegram "⬇️ Pulling latest code..."
            git reset --hard origin/main
            git pull origin main

            # --------------------
            CURRENT_STEP="uv check"
            send_telegram "🐍 Checking uv..."
            UV_BIN="/root/.local/bin/uv"
            if [ ! -f "$UV_BIN" ]; then
              send_telegram "❌ uv not found at $UV_BIN"
              exit 1
            fi

            # --------------------
            CURRENT_STEP="dependencies"
            send_telegram "📦 Syncing dependencies..."
            $UV_BIN sync

            # --------------------
            CURRENT_STEP="migration check"
            send_telegram "🧠 Checking migrations..."
            $UV_BIN run python manage.py makemigrations --check --dry-run

            # --------------------
            CURRENT_STEP="migrate"
            send_telegram "🧱 Applying migrations..."
            $UV_BIN run python manage.py migrate --noinput

            # --------------------
            CURRENT_STEP="collectstatic"
            send_telegram "🎨 Collecting static files..."
            $UV_BIN run python manage.py collectstatic --noinput

            # --------------------
            CURRENT_STEP="restart"
            send_telegram "♻️ Restarting Django service..."
            systemctl restart django

            send_telegram "✅ DEPLOY SUCCESSFUL 🎉"
