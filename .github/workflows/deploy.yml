name: Django Production Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            set -e

            send_telegram() {
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="$1" > /dev/null
            }

            send_telegram "🚀 Deploy started on VPS"

            echo "📦 Moving to project..."
            cd /root/axrortech || {
              send_telegram "❌ Project folder not found"
              exit 1
            }

            send_telegram "⬇️ Pulling latest code..."
            git reset --hard origin/main
            git pull origin main

            send_telegram "🐍 Syncing dependencies (uv)..."
            ~/.local/bin/uv sync

            send_telegram "🧠 Checking migrations..."
            ~/.local/bin/uv run manage.py makemigrations --check || {
              send_telegram "❌ Migration check failed!"
              exit 1
            }

            send_telegram "🧱 Applying migrations..."
            ~/.local/bin/uv run manage.py migrate --noinput

            send_telegram "🎨 Collecting static files..."
            ~/.local/bin/uv run manage.py collectstatic --noinput

            send_telegram "♻️ Restarting Django service..."
            systemctl restart django

            send_telegram "✅ Deploy SUCCESSFUL 🎉"
